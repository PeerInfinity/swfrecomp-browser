<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{NAME}} — SWFRecomp</title>
    <script>
        // Cross-origin isolation (SharedArrayBuffer) for the shared-memory graphics
        // host without needing server headers. Requires HTTP, not file://.
        window.coi = { coepCredentialless: () => true, coepDegrade: () => false };
    </script>
    <script src="coi-serviceworker.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 1.5rem; }
        h1 { color: #e94560; font-size: 1.3em; margin-bottom: 0.25rem; }
        #status { color: #888; font-size: 0.9em; margin-bottom: 1rem; }
        #status.error { color: #ff6b6b; white-space: pre-wrap; max-width: 700px; }
        canvas { display: none; max-width: 100%; border: 1px solid #333; border-radius: 8px; background: #000; outline: none; }
        details { margin-top: 1rem; width: 100%; max-width: 700px; }
        summary { cursor: pointer; color: #4ecca3; }
        pre { background: #0f0f23; border: 1px solid #333; border-radius: 8px; padding: 0.75rem; font-size: 12px; color: #ccc; white-space: pre-wrap; max-height: 240px; overflow-y: auto; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <h1>{{NAME}}</h1>
    <div id="status">Loading…</div>
    <canvas id="canvas" width="550" height="400" tabindex="0"></canvas>
    <details><summary>Runtime log</summary><pre id="log"></pre></details>
    <script type="module">
        const status = document.getElementById("status"), logEl = document.getElementById("log");
        const log = (t) => { logEl.textContent += t + "\n"; };
        const setStatus = (t) => { status.textContent = t; };
        try {
            if (!globalThis.crossOriginIsolated) {
                // First load: coi-serviceworker registers itself and reloads the
                // page with COOP/COEP; give it a moment before calling it an error.
                setStatus("Enabling cross-origin isolation (page reloads once)\u2026");
                await new Promise((r) => setTimeout(r, 6000));
            }
            const { runGuest } = await import("./guest_loader.js");
            setStatus("Loading {{NAME}}-guest.wasm");
            const r = await fetch("{{NAME}}-guest.wasm");
            if (!r.ok) throw new Error(`Failed to fetch {{NAME}}-guest.wasm (${r.status})`);
            const guestBytes = new Uint8Array(await r.arrayBuffer());
            await runGuest({ guestBytes, hostDir: "./", canvas: document.getElementById("canvas"), log, setStatus });
            setStatus("Finished");
        } catch (e) {
            console.error(e);
            status.className = "error";
            status.textContent = e.message;
        }
    </script>
</body>
</html>
